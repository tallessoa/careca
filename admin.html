                <form class="work-fields" onsubmit="event.preventDefault();startCount(RESTAURANT,this.elements.zone.value)">
                <label class="work-field">Zona a contar<select name="zone" ${draft?'disabled':''}><option value="">Todas as zonas</option>${zones.map(z=>`<option ${draft?.zone===z?'selected':''}>${escHtml(z)}</option>`).join('')}</select></label>
                <div><button class="work-btn primary">${draft?'Retomar contagem':'Iniciar contagem'}</button></div></form></section>`:''}
                ${role.canLogWaste?'<button class="work-btn" onclick="openWasteModal()">Registar quebra</button>':''}
                ${(appState.countHistory || []).filter(h=>h.store===appState.activeStore).length ? `<details class="p-3 rounded-xl bg-[#0B1120]"><summary>Contagens fechadas</summary>
                    ${(appState.countHistory || []).filter(h=>h.store===appState.activeStore).map(h=>`<details class="p-2"><summary>${escHtml(new Date(h.date).toLocaleString('pt-PT'))} · ${escHtml(appState.stores[h.store].name)} · ${escHtml(h.zone)} · ${fmtEur(h.rows.reduce((n,r)=>n+r.variance,0))}</summary>
                    ${h.entries?`<p>${h.adjusted?'Stock acertado':'Apenas contagem física'}</p><details><summary>Quantidades introduzidas</summary>${h.entries.map(e=>`<div>${escHtml(e.name)} · ${fmtNum(e.qty,4)} ${escHtml(e.unit)}</div>`).join('')}</details>`:''}
                    ${h.rows.map(r=>`<div>${escHtml(r.name)} · contagem ${fmtNum(r.counted,3)} / teórico ${fmtNum(r.expected,3)} ${escHtml(r.unit)} · ${fmtEur(r.variance)}</div>`).join('')}</details>`).join('')}</details>` : ''}
<details class="work-panel"><summary>Consultar desvios de stock</summary>
                <div class="rounded-2xl bg-[#0B1120] border border-[#1E293B] overflow-hidden">
                    <div class="px-5 py-4 border-b border-[#1E293B] flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h2 class="font-bold text-base text-white">Desvios de inventário — ${escHtml(storeName)}</h2>
                            <p class="text-xs text-slate-400">Soma contagens diretas de todas as zonas + sub-receitas explodidas antes de apurar desvios</p>
                        </div>
                        <div class="px-4 py-2 rounded-xl bg-[#050814] border ${variance.totalVarianceEur < 0 ? 'border-rose-500/40' : 'border-emerald-500/40'} font-mono">
                            <span class="text-xs text-slate-400 mr-2">Impacto Total:</span>
                            <span class="font-bold text-base ${variance.totalVarianceEur < 0 ? 'text-rose-400' : 'text-emerald-400'}">${fmtEur(variance.totalVarianceEur)}</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-[#1E293B] text-[11px] font-mono uppercase text-slate-400 bg-[#050814]/60">

                            </thead>
                            <tbody class="divide-y divide-[#1E293B]/60 text-xs sm:text-sm font-mono tabular-nums">
                                ${variance.rows.map(r => {
                                    const neg = r.varianceQty < -0.05;
                                    const pos = r.varianceQty > 0.05;
                                    return `
                                        <tr class="hover:bg-[#111827]/70">
                                            <td class="py-3 px-5 font-sans font-semibold text-white">${escHtml(r.name)} <span class="text-[11px] font-mono text-slate-500">(${escHtml(r.zone)})</span></td>
                                            <td class="py-3 px-4 text-right text-slate-300">${fmtNum(r.stockTheoretical, 2)} ${escHtml(r.baseUnit)}</td>
                                            <td class="py-3 px-4 text-right text-slate-200">${fmtNum(r.stockCounted, 2)} ${escHtml(r.baseUnit)}</td>
                                            <td class="py-3 px-4 text-right text-sky-400">${r.fromSubRecipesBase > 0 ? '+' + fmtNum(r.fromSubRecipesBase, 2) + ' ' + escHtml(r.baseUnit) : '—'}</td>
                                            <td class="py-3 px-4 text-right font-bold ${neg ? 'text-rose-400' : pos ? 'text-emerald-400' : 'text-slate-400'}">
                                                ${r.varianceQty > 0 ? '+' : ''}${fmtNum(r.varianceQty, 2)} ${escHtml(r.baseUnit)}
                                            </td>
                                            <td class="py-3 px-5 text-right font-bold ${neg ? 'text-rose-400' : pos ? 'text-emerald-400' : 'text-slate-400'}">
                                                ${r.varianceEur > 0 ? '+' : ''}${fmtEur(r.varianceEur)}

                </details>
                <div class="rounded-2xl bg-[#0B1120] border border-[#1E293B] p-5">
                    <h3 class="font-bold text-sm text-white mb-3">Últimas Quebras / Desperdícios Registados</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        ${appState.wasteLogs.filter(w => w.store === appState.activeStore).slice(0, 6).map(w => `

                                <div>
                                    <div class="font-semibold text-white">${escHtml(w.item)}</div>
                                    <div class="text-[11px] text-slate-400">${escHtml(w.reason)} • ${escHtml(w.date)} • ${escHtml(appState.stores[w.store]?.name || '')}</div>

                                <div class="text-right font-mono">

        }

        // ====================================================================

        window.addEventListener('DOMContentLoaded', () => {
            updateChrome();
            renderActiveView();
        });
    </script>
<script>
(() => {
    const definitions = [[["COGS teórico", "CMV teórico", "Food Cost Teórico"], "Custo previsto dos ingredientes consumidos, calculado a partir das quantidades vendidas e das fichas técnicas."], [["COGS real", "CMV real", "Food Cost real"], "Custo do consumo apurado pelo inventário. Num período simples, corresponde ao stock inicial mais as compras, menos o stock final."], [["COGS", "CMV"], "Custo das mercadorias vendidas. Mede o custo dos ingredientes e bebidas consumidos para produzir as vendas do período."], [["Food Cost", "FC"], "Percentagem das vendas líquidas absorvida pelo custo. Numa ficha, divide-se o custo por dose pelo preço de venda sem IVA e multiplica-se por 100."], [["Vendas líquidas", "PVP líquido", "PVP líq.", "PVP s/ IVA", "PVP sem IVA"], "Preço ou receita de venda depois de retirar o IVA. Um preço de 16,39 € com IVA de 13% corresponde a 14,50 € líquidos."], [["PVP c/ IVA", "PVP com IVA", "PVP"], "Preço de venda ao público. Quando indicado «com IVA», é o valor final pago pelo cliente."], [["Taxa de IVA", "Taxas de IVA", "IVA"], "Imposto sobre o Valor Acrescentado. Para obter o preço líquido, divide-se o preço com imposto por 1 mais a taxa em forma decimal."], [["Margem bruta"], "Valor das vendas sem IVA que sobra depois de deduzir o custo das mercadorias vendidas. Ajuda a pagar pessoal e restantes gastos."], [["Margem líquida por canal", "Margens por canal", "Margem por canal", "Margem", "Margens"], "No comparativo de canais, é o preço sem IVA menos o custo da receita, a embalagem e a comissão. Em percentagem, divide-se a margem pelo preço sem IVA."], [["Prime Cost", "Custo Primo"], "Soma do custo das mercadorias vendidas com salários e encargos de pessoal."], [["EBITDA Operacional", "EBITDA"], "Resultado operacional antes de juros, impostos, depreciações e amortizações. Resume o resultado depois dos custos operacionais considerados na DRE."], [["DRE Operacional", "Demonstração de Resultados", "DRE"], "Relatório que parte das vendas e deduz mercadorias, pessoal e outros custos para mostrar o resultado da operação."], [["KPI", "KPIs"], "Indicador-chave de desempenho. Por exemplo, o food cost e o desvio de inventário ajudam a acompanhar a operação."], [["Benchmark", "Benchmarks"], "Valor de referência usado para comparar um indicador do restaurante com uma meta ou com o setor."], [["SKU"], "Código interno único de um artigo do catálogo. Permite reconhecer o mesmo ingrediente mesmo que a descrição comercial varie."], [["Unidade base", "Unidades base", "Unid. base"], "Unidade usada para registar e valorizar o ingrediente em stock, por exemplo quilograma, litro ou unidade."], [["Conversão de embalagens", "unidades de compra", "unidade de compra"], "Transforma embalagens de compra em unidades de stock. Uma caixa de seis garrafas de 0,75 L corresponde a 4,5 L."], [["Conversão multi-dimensão", "Multi-Dimensão"], "Conversão entre grandezas diferentes com um fator próprio do artigo, como o peso médio de um ovo."], [["Custo Médio Ponderado", "Custo médio atual", "CMP"], "Custo médio por unidade, ponderado pelas quantidades. Soma-se o valor do stock existente ao da nova entrada e divide-se pela quantidade total."], [["Último custo de compra", "Último custo", "Último preço"], "Preço unitário da compra mais recente do artigo."], [["Ficha técnica dinâmica", "Fichas técnicas", "Ficha técnica"], "Lista de ingredientes, quantidades, perdas e rendimento de uma receita que permite calcular o custo do lote e de cada dose."], [["Sub-receitas", "Sub-receita", "Preparações intermédias", "Preparação intermédia"], "Receita intermédia, como um caldo ou um molho, usada como componente de outro prato."], [["Yield Factor", "Yield", "Fator de aproveitamento", "Aproveitamento"], "Percentagem aproveitável do ingrediente após limpeza. Com 82% de aproveitamento, 180 g limpos exigem cerca de 220 g brutos."], [["Margem de perda", "Quebra técnica", "Quebras técnicas"], "Percentagem prevista que se perde ao limpar ou preparar um ingrediente, como pele, cascas ou espinhas."], [["Quebra de cocção", "Quebra cocção"], "Perda de peso ou volume durante a confeção, por exemplo quando um molho reduz ao lume."], [["Quantidade líquida", "Quantidades líquidas"], "Quantidade aproveitável que entra na receita depois das perdas de preparação."], [["Quebra operacional", "Quebras operacionais", "Desperdício", "Desperdícios", "Wastage", "Quebras", "Quebra"], "Saída de stock registada por motivos como validade, erro de cozinha ou dano. Registar o motivo ajuda a explicar os desvios no inventário."], [["Staff Meal", "Refeição de equipa", "Refeições de equipa"], "Consumo de ingredientes em refeições do pessoal, registado para distinguir esse consumo das vendas."], [["Stock mínimo", "Ponto de encomenda"], "Quantidade de segurança definida para um artigo. Abaixo deste nível, o sistema pode sugerir reposição."], [["Rutura de stock", "Ruturas de stock", "Rutura iminente", "Ruturas"], "Risco de o artigo se esgotar antes da próxima reposição. O aviso de rutura iminente indica que o stock baixou do mínimo."], [["Cobertura de stock", "Cobertura"], "Número de dias que o stock disponível deverá durar ao ritmo médio de consumo."], [["Detetor de inflação", "Inflação", "Inflação (90d)"], "Variação percentual do preço de compra. O alerta do ingrediente compara o novo preço com o último e dispara acima de 5%. A percentagem de 90 dias do fornecedor é demonstrativa."], [["Tendência"], "Gráfico da evolução dos valores no histórico. No catálogo acompanha os preços registados do ingrediente. Na lista de fornecedores usa dados de demonstração."], [["Variância de inventário", "Variância", "Desvio de inventário", "Desvios de inventário", "Desvios de stock", "Teórico vs Real"], "Diferença entre quantidade contada e stock teórico à contagem. Multiplicar a diferença pelo custo unitário dá o impacto em euros."], [["Stock teórico"], "Quantidade que deveria existir segundo as entradas, vendas, quebras e acertos registados."], [["Contagem física", "Inventário físico"], "Verificação presencial das quantidades existentes nas prateleiras, câmaras e restantes zonas."], [["Ledger imutável de stock", "Ledger"], "Livro de movimentos de stock. Regista entradas, consumos, quebras e acertos para se poder seguir a origem de cada alteração."], [["Guias de remessa", "Guia de remessa", "GR"], "Documento que acompanha a entrega da mercadoria. Pode registar a receção antes da fatura do fornecedor."], [["Faturas", "Fatura", "FT"], "Documento de cobrança do fornecedor. Uma fatura ligada a uma guia já recebida permite conferir a compra sem duplicar a entrada em stock."], [["Notas de crédito", "Nota de crédito", "NC"], "Documento emitido pelo fornecedor para creditar um valor. No protótipo, a entrada manual deste tipo corresponde a uma devolução física."], [["Matriz BCG da restauração", "Matriz BCG", "BCG", "Engenharia de menu"], "Classificação dos pratos pela margem por unidade e pela popularidade, medida através do volume de vendas."], [["Estrelas", "Estrela"], "Pratos com margem e volume de vendas elevados em relação à referência da carta."], [["Vacas leiteiras", "Vaca leiteira", "Cavalos de batalha", "Cavalo de batalha"], "Pratos muito vendidos com margem por unidade inferior à referência da carta."], [["Questionamento", "Questionamentos", "Quebra-cabeças"], "Pratos com boa margem por unidade, mas com poucas vendas."], [["Cão de estimação", "Cães de estimação", "Cães", "Abacaxi"], "Quadrante de pratos com baixa margem e poucas vendas em relação à referência da carta."], [["Mapeamento POS", "1-para-N", "Combos", "Combo", "Explosão de receitas"], "Associação de um código de caixa a uma ou mais receitas. Um menu pode consumir os ingredientes da sopa, do prato e da bebida na mesma venda."], [["Dark kitchen", "Cloud kitchen"], "Cozinha dedicada à produção de refeições para entrega ao domicílio."], [["Catering"], "Produção de refeições para eventos, planeada com base no número de convidados."], [["Cozinha central"], "Unidade que prepara bases ou refeições para abastecer outros estabelecimentos."], [["MVP"], "Produto mínimo viável. Primeira versão com as funcionalidades essenciais para testar o serviço."], [["CRUD"], "Operações básicas de gestão de um registo: criar, consultar, editar e eliminar."], [["Multi-tenant"], "Arquitetura que permite a várias organizações usarem o mesmo software com os seus dados isolados."], [["Multi-estabelecimento"], "Gestão de vários espaços de uma organização, com informação individual ou consolidada."], [["RBAC"], "Controlo de acesso por perfil. As ações disponíveis dependem da função, como gerente, chefe de cozinha ou contabilista."], [["RLS"], "Controlo de acesso ao nível de cada linha da base de dados."], [["DAG"], "Grafo dirigido sem ciclos. Representa as ligações de dependência entre ingredientes, preparações e pratos."], [["Recálculo em cascata", "Cascata DAG"], "Atualização das preparações e pratos dependentes quando muda o custo de um ingrediente."], [["Transação ACID", "ACID"], "Conjunto de garantias da base de dados que permitem executar uma operação completa de forma consistente, mesmo perante falhas ou acessos simultâneos."], [["Base de dados relacional", "PostgreSQL"], "Sistema que organiza dados em tabelas relacionadas, como faturas, fornecedores e ingredientes."], [["Supabase"], "Plataforma que disponibiliza uma base de dados PostgreSQL e serviços para aplicações."], [["API"], "Interface que permite a dois sistemas trocarem dados ou pedirem operações de forma definida."], [["JSON"], "Formato de texto estruturado por campos e valores, usado para trocar dados entre sistemas."], [["Structured Outputs", "Structured Output"], "Extração em que a resposta segue um formato de dados definido, como campos para fornecedor, artigo e quantidade."], [["OCR"], "Reconhecimento ótico de caracteres. Converte texto visível numa fotografia ou num documento digitalizado em texto que pode ser processado."], [["IA", "Google Gemini", "Gemini"], "Inteligência artificial usada, por exemplo, para interpretar uma fatura e identificar os seus campos. O ecrã de exemplo do Kareca usa uma amostra local."], [["Human-in-the-loop"], "Validação humana da extração. A pessoa confere e corrige os dados antes de aprovar a entrada em stock."], [["POS"], "Sistema de caixa e faturação que regista as vendas do restaurante."], [["Webhooks", "Webhook"], "Notificação automática enviada por um sistema a outro quando ocorre um evento, como uma venda."], [["Idempotência"], "Propriedade que permite repetir uma operação, como importar o mesmo lote de vendas, sem duplicar o resultado."], [["SAF-T PT", "SAF-T (PT)", "SAF-T"], "Ficheiro de auditoria fiscal em formato XML que pode conter os documentos de faturação do restaurante."], [["NIF"], "Número de Identificação Fiscal. Identifica o contribuinte, por exemplo o fornecedor de uma fatura."], [["ATCUD"], "Código Único de Documento que identifica um documento fiscal."]];
    const aliases = new Map();
    for (const [names, definition] of definitions) {
        for (const alias of names) aliases.set(alias.toLocaleLowerCase('pt'), definition);
    }
    const escapePattern = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const names = [...aliases.keys()].sort((a,b)=>b.length-a.length).map(escapePattern);
    const pattern = new RegExp('(?<![\\p{L}\\p{N}_])(?:'+names.join('|')+')(?![\\p{L}\\p{N}_])','giu');
    const excluded = 'script,style,svg,textarea,input,select,option,pre,code,[contenteditable]:not([contenteditable="false"]),.gloss-term,.gloss-help,[data-kareca-widget]';
    function help(term) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'gloss-help';
        button.textContent = '?';
        button.setAttribute('aria-label','Perguntar ao Careca sobre ' + term);
        button.onclick = event => {
            event.preventDefault();
            event.stopPropagation();
            document.dispatchEvent(new CustomEvent('careca:glossario', {detail:{
                term, definition:aliases.get(term.toLocaleLowerCase('pt'))
            }}));
        };
        return button;
    }
    let helpAnchor = 0;
    function annotate(node) {
        const parent = node.parentElement;
        if (!parent || parent.closest(excluded)) return;
        const matches = [...node.data.matchAll(pattern)];
        if (!matches.length) return;
        const control = parent.closest('button,a[href],label,summary,[role="button"]');
        const fragment = document.createDocumentFragment();
        let index = 0;
        for (const match of matches) {
            fragment.append(node.data.slice(index,match.index));
            const span = document.createElement('span');
            span.className = 'gloss-term';
            span.textContent = match[0];
            fragment.append(span);
            const button = help(match[0]);
            if (control) {
                const anchor = '--gloss-' + ++helpAnchor;
                span.classList.add('gloss-term-anchored');
                span.style.setProperty('anchor-name', anchor);
                button.classList.add('gloss-help-anchored');
                button.style.setProperty('position-anchor', anchor);
                control.after(button);
            }
            else fragment.append(button);
            index = match.index + match[0].length;
        }
        fragment.append(node.data.slice(index));
        node.replaceWith(fragment);
    }
    function scan(root) {
        if (root.nodeType === Node.TEXT_NODE) {annotate(root);return;}
        if (root.nodeType !== Node.ELEMENT_NODE || root.closest(excluded)) return;
        const walker = document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(annotate);
    }
    const options={childList:true,subtree:true,characterData:true};
    const observer=new MutationObserver(records=>{
        observer.disconnect();
        const roots=new Set();
        for (const record of records) {
            if (record.type==='characterData') roots.add(record.target);
            else record.addedNodes.forEach(node=>roots.add(node));
        }
        for (const root of roots) if (root.isConnected) scan(root);
        observer.observe(document.body,options);
    });
    const toggle = document.getElementById('gloss-enabled');
    const preference = 'kareca.glossario.ativo';
    function applyPreference() {
        observer.disconnect();
        document.documentElement.classList.toggle('gloss-off', !toggle.checked);
        if (toggle.checked) {
            scan(document.body);
            observer.observe(document.body, options);
        }
    }
    try { toggle.checked = localStorage.getItem(preference) !== 'false'; } catch {}
    toggle.addEventListener('change', () => {
        applyPreference();
        try { localStorage.setItem(preference, String(toggle.checked)); } catch {}
    });
    applyPreference();
})();

</script>

 a Kareca</button><button>Fichas técnicas</button><button>O que é CMP?</button><button>Gestão de stock</button></div>\n    </div><div id=\"k-form\"><textarea rows=\"2\" id=\"k-input\" aria-label=\"A tua pergunta\" placeholder=\"A tua pergunta…\" enterkeyhint=\"send\" maxlength=\"500\" autocomplete=\"off\"></textarea><button type=\"button\" id=\"k-send\" aria-label=\"Enviar pergunta\">Enviar</button></div>\n  </section>\n</div>";
const byId = id => root.getElementById(id);
const widget = byId('careca'), launch = byId('k-launch'), input = byId('k-input');
const panel = byId('k-panel');
let speechTimer, position, gesture, dragged = false;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
function layout() {
  const view = window.visualViewport;
  const left = (view?.offsetLeft || 0) + 8, top = (view?.offsetTop || 0) + 8;
  const right = left + (view?.width || innerWidth) - 16;
  const bottom = top + (view?.height || innerHeight) - 16;
  const box = widget.getBoundingClientRect();
  const x = clamp(position?.x ?? box.left, left, right - box.width);
  const y = clamp(position?.y ?? box.top, top, bottom - box.height);
  Object.assign(widget.style, {left:x+'px', top:y+'px', right:'auto', bottom:'auto'});
  if (panel.hidden) return;
  const gap = 10, before = x-left-gap, after = right-x-box.width-gap;
  const beside = Math.max(before,after) >= 215;
  const width = Math.min(320, beside ? Math.max(before,after) : right-left);
  const above = y-top-gap, below = bottom-y-box.height-gap;
  const height = Math.min(350, beside ? bottom-top : Math.max(above,below,Math.min(190,bottom-top)));
  const side = beside ? (before >= after ? 'left' : 'right') : 'stack';
  const px = beside ? (side==='left' ? x-width-gap : x+box.width+gap) : clamp(x+box.width/2-width/2,left,right-width);
  const py = clamp(beside ? y+box.height-height : (above>=below ? y-gap-height : y+box.height+gap),top,bottom-height);
  panel.dataset.side = side;
  Object.assign(panel.style,{left:px+'px',top:py+'px',width:width+'px',height:height+'px'});
  panel.style.setProperty('--tip',clamp(y+box.height/2-py,12,height-20)+'px');
}
launch.onpointerdown = e => {
  if (!e.isPrimary || e.button !== 0) return;
  const box = widget.getBoundingClientRect();
  dragged = false;
  gesture = {id:e.pointerId,x:e.clientX,y:e.clientY,left:box.left,top:box.top};
  launch.setPointerCapture(e.pointerId);
};
launch.onpointermove = e => {
  if (gesture?.id !== e.pointerId) return;
  const dx = e.clientX-gesture.x, dy = e.clientY-gesture.y;
  if (!dragged && Math.hypot(dx,dy)<5) return;
  dragged = true;
  position = {x:gesture.left+dx,y:gesture.top+dy};
  layout();
};
launch.onlostpointercapture = launch.onpointercancel = launch.onpointerup = () => { gesture = null; };
window.addEventListener('resize',layout);
window.visualViewport?.addEventListener('resize',layout);
window.visualViewport?.addEventListener('scroll',layout);

function show(state, focusTarget) {
  const open = state === 'open', mini = state === 'mini';
  clearTimeout(speechTimer);
  delete widget.dataset.speaking;
  widget.dataset.state = state;
  byId('k-panel').hidden = !open;
  byId('k-mini').hidden = state !== 'idle';
  byId('k-label').hidden = state !== 'idle';
  launch.setAttribute('aria-expanded', String(open));
  launch.setAttribute('aria-label', mini ? 'Reabrir o Careca' : open ? 'Recolher conversa' : 'Pergunte ao Careca');
  layout();
  (focusTarget ?? (open ? input : launch)).focus({preventScroll:true});
}
launch.onclick = e => {
  if (dragged && e.detail) { dragged = false; return; }
  show(widget.dataset.state === 'open' ? 'idle' : 'open');
};
byId('k-mini').onclick = byId('k-hide').onclick = () => show('mini');
widget.onkeydown = e => { if (e.key === 'Escape' && widget.dataset.state === 'open') show('idle'); };
const topics=[
{terms:['kareca','empresa','solucoes','solutions','plataforma','sistema'],answer:'A Kareca Solutions disponibiliza ferramentas de backoffice e inteligência operacional para restauração: análise financeira, fichas técnicas, inventário e acompanhamento de indicadores de gestão.'},
{terms:['ficha','fichas','receita','ingrediente','prato'],answer:'Nas fichas técnicas, registas ingredientes, quantidades, preços e perdas. Assim consegues calcular o custo de cada receita e comparar com o respetivo preço de venda.'},
{terms:['cmp','custo medio ponderado'],answer:'CMP significa Custo Médio Ponderado. É o custo médio unitário de um ingrediente, considerando as diferentes quantidades e preços de entrada em stock.'},
{terms:['stock','estoque','inventario','contagem'],answer:'A gestão de stock acompanha entradas, saídas e quantidades teóricas. A contagem física permite comparar com o valor esperado e identificar desvios.'},
{terms:['margem','lucro','rentabilidade','food cost'],answer:'A margem compara a receita com os respetivos custos. O food cost indica a proporção do preço de venda consumida pelo custo dos ingredientes. Os indicadores ajudam a rever preços e porções.'},
{terms:['dre','dashboard','indicador','relatorio'],answer:'O dashboard reúne indicadores de desempenho. A DRE (Demonstração de Resultados do Exercício) organiza receitas e despesas para avaliar o resultado do negócio.'},
{terms:['fornecedor','fatura','iva','compra'],answer:'Os módulos de fornecedores e documentos ajudam a organizar compras, faturas e os respetivos valores. Confirma sempre os dados contabilísticos antes de os utilizar em declarações oficiais.'},
{terms:['ajuda','suporte','contacto','humano'],answer:'Posso orientar-te pelos conceitos e funcionalidades mais comuns. Para suporte específico, é necessário ligar este assistente a um canal de contacto ou à documentação do teu sistema.'},
{terms:['ola','bom dia','boa tarde','boa noite','oi'],answer:'Olá! 👋 Podes perguntar-me sobre fichas técnicas, custos, gestão de stock, CMP, margens e indicadores do backoffice.'}
];
function normalize(s){return s.toLocaleLowerCase('pt-PT').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function respond(q){const text=normalize(q);let best=null,score=0;for(const t of topics){let n=0;for(const term of t.terms){const norm=normalize(term);if((' '+text+' ').includes(' '+norm+' '))n+=norm.includes(' ')?3:2}if(n>score){score=n;best=t}}return best?best.answer:'Ainda não tenho uma resposta pré-configurada para essa pergunta. Experimenta perguntar sobre fichas técnicas, CMP, gestão de stock, margens ou dashboard. Para respostas livres sobre dados reais, será necessária integração com um serviço de IA.'}

function ask(question, definition) {
  question = question.trim();
  if (!question) return;
  const log = byId('k-log');
  for (const [role, text] of [['user', question], ['bot', definition ?? respond(question)]]) {
    const message = document.createElement('p');
    message.className = role;
    message.textContent = text;
    log.append(message);
  }
  byId('k-quick').hidden = true;
  const scroll = byId('k-scroll');
  scroll.scrollTop = scroll.scrollHeight;
  clearTimeout(speechTimer);
  widget.dataset.speaking = '';
  speechTimer = setTimeout(() => { delete widget.dataset.speaking; }, 1600);
}
document.addEventListener('careca:glossario', event => {
  const {term, definition} = event.detail || {};
  if (typeof term !== 'string' || typeof definition !== 'string') return;
  show('open', byId('k-scroll'));
  ask('O que significa «' + term + '»?', definition);
});
function send() {
  if (!input.value.trim()) return;
  ask(input.value);
  input.value = '';
  input.focus({preventScroll:true});
}
byId('k-send').onclick = send;
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    send();
  }
};
byId('k-quick').onclick = e => { if (e.target.tagName === 'BUTTON') ask(e.target.textContent); };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, {once:true});
else mount();
})();
