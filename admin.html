        // ====================================================================
        function fmtEur(value, decimals = 2) {
            const num = Number(value) || 0;
            return num.toLocaleString('pt-PT', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }) + ' €';
        }

        function fmtPct(value, decimals = 1) {
            const num = Number(value) || 0;
            return num.toLocaleString('pt-PT', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }) + '%';
        }

        function fmtNum(value, decimals = 2) {
            const num = Number(value) || 0;
            return num.toLocaleString('pt-PT', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        function escHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(title, subtitle = '', tone = 'info') {
            const stack = document.getElementById('toast-stack');
            if (!stack) return;
            const colors = {
                info: 'border-sky-400/45 bg-[#0B1120] text-sky-400',
                success: 'border-emerald-500/45 bg-[#0B1120] text-emerald-400',
                warning: 'border-amber-500/45 bg-[#0B1120] text-amber-400',
                danger: 'border-rose-500/45 bg-[#0B1120] text-rose-400'
            };
            const dotColors = {
                info: 'bg-sky-400',
                success: 'bg-emerald-400',
                warning: 'bg-amber-400',
                danger: 'bg-rose-500'
            };
            const el = document.createElement('div');
            el.className = `pointer-events-auto rounded-xl border ${colors[tone] || colors.info} p-4 shadow-2xl flex items-start gap-3 transition-all duration-300`;
            el.innerHTML = `
                <span class="w-2.5 h-2.5 rounded-full ${dotColors[tone] || dotColors.info} mt-1.5 shrink-0"></span>
                <div class="min-w-0 flex-1">
                    <div class="text-sm font-semibold text-white">${escHtml(title)}</div>
                    ${subtitle ? `<div class="text-xs text-slate-300 mt-0.5 leading-snug">${escHtml(subtitle)}</div>` : ''}
                </div>
            `;
            stack.appendChild(el);
            setTimeout(() => {
                el.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => el.remove(), 300);
            }, 4200);
        }

        function loadInitialState() {
            const base = createDefaultState();
            try {
                const raw = localStorage.getItem(STORAGE_KEY) ?? localStorage.getItem(LEGACY_KEY);
                if (!raw) return base;
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.ingredients) || !Array.isArray(parsed.recipes)) {
                    return base;
                }
                const state = {
                    ...base,
                    ...parsed,
                    activeStore: RESTAURANT,
                    stores: base.stores,
                    roles: base.roles
                };
                const onlyRestaurant = map => Object.hasOwn(map ?? {}, RESTAURANT) ? { [RESTAURANT]: map[RESTAURANT] } : {};
                state.storeFinancials = onlyRestaurant(state.storeFinancials);
                state.countDrafts = onlyRestaurant(state.countDrafts);
                for (const item of state.ingredients) item.byStore = onlyRestaurant(item.byStore);
                for (const recipe of state.recipes) recipe.soldByStore = onlyRestaurant(recipe.soldByStore);
                for (const prep of state.subRecipesInventory) prep.countedByStore = onlyRestaurant(prep.countedByStore);
                for (const key of ['invoices','salesLog','wasteLogs','alerts','movements','countHistory']) {
                    state[key] = (state[key] || []).filter(entry=>entry.store===RESTAURANT);
                }
                state.sentOrders = state.sentOrders.filter(key=>key.startsWith(RESTAURANT+':'));
                state.importedSales = state.importedSales.filter(entry=>JSON.parse(entry.key)[0]===RESTAURANT);
                return state;
            } catch (err) {
                return base;
            }
        }

        let appState = loadInitialState();
        function snapshotCount(ing, store) {
            const m = ing.byStore[store];
            m.countBasis = m.stockTheoretical;
            m.countCost = m.cmp;
            m.preparedCount = appState.subRecipesInventory.filter(sub => sub.parentIngredientId === ing.id)
                .reduce((n,sub)=>n+(sub.countedByStore[store] || 0)/ing.yieldFactor,0);
            m.countDate = new Date().toISOString();
        }
        function ensureCountBasis() {
            for (const ing of appState.ingredients) {
                for (const store of STORE_KEYS) {
                    if (ing.byStore[store].countBasis == null) snapshotCount(ing, store);
                }
            }
        }
        ensureCountBasis();

        let storageBaseline;
        try {storageBaseline = localStorage.getItem(STORAGE_KEY);} catch {storageBaseline = null;}
        function persistState() {
            try {
                const copy = { ...appState, recipeFormRows: [] };
                if (localStorage.getItem(STORAGE_KEY) !== storageBaseline) {
                    window.alert('Os dados foram alterados noutra janela. A página vai carregar a versão guardada.');
                    location.reload();
                    throw Error('Conflito entre janelas');
                }
                const json = JSON.stringify(copy);
                localStorage.setItem(STORAGE_KEY,json);
                storageBaseline = json;
            } catch (err) {
                if (err.message === 'Conflito entre janelas') throw err;
                window.alert('Falha ao guardar neste navegador. As alterações estão apenas nesta janela.');
                throw err;
            }
        }

        function postReceipt(inv) {
            if (!appState.roles[appState.activeRole].canApproveInvoices) throw Error('Perfil sem permissão de aprovação.');
            const key = value => String(value).replace(/ \(OCR\)$/i,'').trim().toUpperCase().replace(/\s+/g, ' ');
            const existing = appState.invoices.find(i => i.store === inv.store && i.supplierId === inv.supplierId && key(i.id) === key(inv.id));
            if (existing?.status === 'Aprovada') throw Error('Este documento já foi contabilizado.');
            if (!inv.lines?.length) throw Error('Faltam as linhas do documento.');
            for (const line of inv.lines) {
                if (!line.service && !getIngredient(line.ing)?.byStore[inv.store]) throw Error('Artigo por mapear.');
                if (!(line.qty > 0 && line.price >= 0 && Number.isFinite(line.qty * line.price))) throw Error('Quantidade ou preço inválido.');
            }
            let guide;
            if (inv.receiptRef) {
                guide = appState.invoices.find(i=>i.store===inv.store && i.supplierId===inv.supplierId && i.id===inv.receiptRef && i.docType==='Guia de Remessa' && i.status==='Aprovada');
                if (!guide?.lines?.length || guide.billedBy || inv.docType!=='Fatura') throw Error('Guia indisponível ou já faturada.');
                inv.lines = guide.lines.map(line=>({...line}));
                inv.itemsSummary = guide.itemsSummary+' · '+guide.id;
            }
            const sign = inv.docType === 'Nota de Crédito' ? -1 : 1;
            const round = n => Math.round((n + Number.EPSILON) * 100) / 100;
            const net = round(sign * inv.lines.reduce((n,l) => n + l.qty*l.price, 0));
            if (inv.net != null && Math.abs(inv.net-net) > 0.009) throw Error('As linhas não reconciliam com o total do documento.');
            if (sign < 0 && inv.lines.some(l=>!l.service && l.qty > getIngredient(l.ing).byStore[inv.store].stockTheoretical)) throw Error('Devolução superior ao stock disponível.');
            for (const l of inv.lines) {
                if (guide || l.service) continue;
                const ing = getIngredient(l.ing), m = ing.byStore[inv.store];
                if (m.countBasis == null) snapshotCount(ing, inv.store);
                const previous = m.lastCost;
                const oldQty = m.stockTheoretical;
                if (sign > 0) {
                    m.cmp = weightedAverageCost(oldQty, m.cmp, l.qty, l.price);
                    m.prevCost = previous;
                    m.lastCost = l.price;
                    ing.priceHistory.push(l.price);
                }
                m.stockTheoretical += sign*l.qty;
                appState.movements.push({store:inv.store, ingredient:l.ing, document:inv.id, qty:sign*l.qty, date:inv.date});
                if (sign > 0 && previous > 0 && l.price > previous*1.05) appState.alerts.unshift({
                    id:crypto.randomUUID(),type:'price_inflation',severity:'warning',store:inv.store,unread:true,time:'Agora',
                    title:ing.name+' · aumento '+fmtPct((l.price/previous-1)*100),message:'Última compra da loja: '+fmtEur(previous)+' → '+fmtEur(l.price)
                });
            }
            const vat = round(sign * inv.lines.reduce((n,l)=>n+l.qty*l.price*l.vat/100,0));
            Object.assign(inv,{net,vat,total:round(net+vat),status:'Aprovada'});
            if (guide) guide.billedBy = inv.id;
            if (existing) Object.assign(existing,inv);
            else appState.invoices.unshift(inv);
        }

        function finishReceipt(inv) {
            try { postReceipt(inv); } catch (error) { showToast('Compra pendente', error.message,'warning'); return; }

        function buildSparklineSvg(points, color = '#38BDF8') {
            const w = 88, h = 26;
            const min = Math.min(...points);
            const max = Math.max(...points);
            const range = max - min || 1;
            const coords = points.map((p, i) => {
                const x = (i / Math.max(1, points.length - 1)) * (w - 6) + 3;
                const y = h - 4 - ((p - min) / range) * (h - 8);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="inline-block"><polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${coords}"/></svg>`;
        }

                                const sup = getSupplier(i.supplierId);
                                const suggestedQty = Math.max(1, Math.ceil((m.minStock * 1.6) - m.stockTheoretical));
                                const estTotal = suggestedQty * m.lastCost;
                                const orderKey = `${appState.activeStore}:${i.id}`;
                                const isSent = appState.sentOrders.includes(orderKey);

                                return `

                                                </span>
                                                <span class="text-xs font-mono text-slate-400">${escHtml(i.sku)}</span>
                                            </div>
                                            <h3 class="font-bold text-white">${escHtml(i.name)}</h3>
                                            <p class="text-xs text-slate-400 mt-0.5">${sup ? escHtml(sup.name) : 'Sem fornecedor'}</p>
                                            <div class="mt-4 grid grid-cols-2 gap-2 p-3 rounded-xl bg-[#050814] border border-[#1E293B] text-xs font-mono">
                                                <div>
                                                    <span class="text-slate-500 block">Stock Atual</span>
                                                    <span class="text-rose-400 font-bold">${fmtNum(m.stockTheoretical, 1)} ${escHtml(i.baseUnit)}</span>
                                                </div>
                                                <div>
                                                    <span class="text-slate-500 block">Stock Mínimo</span>
                                                    <span class="text-slate-300">${fmtNum(m.minStock, 1)} ${escHtml(i.baseUnit)}</span>
                                                </div>
                                                <div>
                                                    <span class="text-slate-500 block">Sugestão Pedido</span>
                                                    <span class="text-sky-400 font-bold">+${suggestedQty} ${escHtml(i.baseUnit)}</span>
                                                </div>
                                                <div>
                                                    <span class="text-slate-500 block">Valor Estimado</span>
                                                    <span class="text-white font-bold">${fmtEur(estTotal)}</span>
                                                </div>
                                            </div>
                                        </div>
                                        ${role.canManageOrders ? `
                                            <button onclick="generatePurchaseOrder('${i.id}', ${suggestedQty})" class="w-full py-2.5 rounded-xl text-xs font-semibold ${isSent ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-blue-600 hover:bg-blue-500 text-white'} transition-all">
                                                ${isSent ? '✓ Encomenda preparada (ver mensagem)' : 'Gerar Encomenda (Email / WhatsApp)'}
                                            </button>
                                        ` : `<div class="text-center text-[11px] font-mono text-slate-500 py-2">🔒 Encomendas bloqueadas neste perfil</div>`}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Fornecedores, Insumos &amp; Encomendas</h1>
                        <p class="text-sm text-slate-400 mt-0.5">Stock, custos e reposição (${escHtml(storeName)}).</p>
                    </div>
                    <div class="flex flex-wrap gap-2 p-1 rounded-xl bg-[#0B1120] border border-[#1E293B]">
                        <button onclick="setSupplierSubTab('catalog')" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition-all ${sub === 'catalog' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">Insumos &amp; Perdas (${appState.ingredients.length})</button>
                        <button onclick="setSupplierSubTab('suppliers')" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition-all ${sub === 'suppliers' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">Fornecedores (${appState.suppliers.length})</button>
                        <button onclick="setSupplierSubTab('orders')" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition-all ${sub === 'orders' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">Encomendas (${suggestedItems.length})</button>
                    </div>
                </div>
                ${tabContent}
            `;
        }

        // --- CRUD FORNECEDORES ---

                        </div>
                    </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Categoria Principal</label>
                            <input id="sup-cat" type="text" value="${sup ? escHtml(sup.category) : 'Peixe, Carnes & Frescos'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">

                        <div>

                    <div class="flex justify-end gap-3 pt-2">

        function saveSupplierForm(e, supId) {
            e.preventDefault();
            if (!appState.roles[appState.activeRole].canEditSuppliers) return;

            const payload = {
                name: document.getElementById('sup-name').value.trim(),
                nif: document.getElementById('sup-nif').value.trim(),
                category: document.getElementById('sup-cat').value.trim(),
                terms: document.getElementById('sup-terms').value,
                email: document.getElementById('sup-email').value.trim(),
                phone: document.getElementById('sup-phone').value.trim()
            };

            if (supId) {
                const existing = getSupplier(supId);
                if (existing) Object.assign(existing, payload);
                showToast('Fornecedor atualizado', `${payload.name} guardado com sucesso.`, 'success');
            } else {
                appState.suppliers.unshift({
                    id: 'sup_' + Date.now(),
                    ...payload,
                    inflationPct: 0.0,
                    history: [10.0, 10.0, 10.0, 10.0]
                });
                showToast('Fornecedor criado', `${payload.name} adicionado ao diretório.`, 'success');
            }

            persistState();
            closeModal();
            renderActiveView();
        }

        function confirmDeleteSupplier(supId) {
            if (!appState.roles[appState.activeRole].canEditSuppliers) {
                showToast('Permissão RBAC insuficiente', 'O perfil atual não pode excluir fornecedores.', 'warning');
                return;
            }
            const sup = getSupplier(supId);
            if (!sup) return;
            const html = `
                <div class="space-y-4">
                    <p class="text-sm text-slate-300">Tem a certeza que pretende remover o fornecedor <strong class="text-white">${escHtml(sup.name)}</strong> (NIF ${escHtml(sup.nif)})?</p>
                    <div class="flex justify-end gap-3 pt-2">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm text-slate-300 border border-[#1E293B]">Cancelar</button>
                        <button onclick="executeDeleteSupplier('${sup.id}')" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white">Sim, Excluir</button>
                    </div>
                </div>
            `;
            openModal('Excluir Fornecedor', 'Confirmação de remoção', html);
        }

        function executeDeleteSupplier(supId) {
            if (!appState.roles[appState.activeRole].canEditSuppliers) return;
            const sup = getSupplier(supId);
            if (appState.invoices.some(i=>i.supplierId===supId) || appState.ingredients.some(i=>i.supplierId===supId)) {
                showToast('Fornecedor em utilização','Existem documentos ou artigos associados.','warning');return;
            }
            appState.suppliers = appState.suppliers.filter(s => s.id !== supId);
            persistState();
            closeModal();
            showToast('Fornecedor removido', sup ? sup.name : 'Registo excluído.', 'warning');
            renderActiveView();
        }

        // --- CRUD INSUMOS (MARGEM DE PERDA, STOCK MÍNIMO, CUSTOS POR LOJA) ---
        function openIngredientModal(ingId = null) {
            if (!appState.roles[appState.activeRole].canEditIngredients) {
                showToast('Permissão RBAC insuficiente', 'O perfil atual está em modo só leitura para o catálogo de insumos.', 'warning');
                return;
            }
            const targetStore = RESTAURANT;
            const ing = ingId ? getIngredient(ingId) : null;
            const m = ing ? getIngMetricsForStore(ing, appState.activeStore) : { stockTheoretical: 10.0, minStock: 6.0, cmp: 8.50, lastCost: 8.50 };
            const isEdit = Boolean(ing);
            const lossPct = ing ? Math.round((1 - ing.yieldFactor) * 100) : 0;
            const supOpts = appState.suppliers.map(s => `<option value="${s.id}" ${ing && ing.supplierId === s.id ? 'selected' : ''}>${escHtml(s.name)}</option>`).join('');
            const zones = ['Câmara Fria', 'Congelador', 'Despensa Seca', 'Bar'];
            const cats = ['Proteínas', 'Hortícolas', 'Laticínios', 'Secos', 'Bebidas', 'Embalagens'];
            const units = ['kg', 'L', 'un'];

            const html = `
                <form onsubmit="saveIngredientForm(event, '${ing ? ing.id : ''}')" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Nome do Insumo / Matéria-Prima *</label>
                            <input id="ing-name" type="text" required value="${ing ? escHtml(ing.name) : ''}" placeholder="Ex: Camarão Tigre 16/20" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Código SKU *</label>
                            <input id="ing-sku" type="text" required value="${ing ? escHtml(ing.sku) : 'INS-' + Math.floor(100 + Math.random() * 899)}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm font-mono text-white focus:outline-none focus:border-sky-400">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Categoria</label>
                            <select id="ing-cat" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">
                                ${cats.map(c => `<option value="${c}" ${ing && ing.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Zona Armazenamento</label>
                            <select id="ing-zone" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">
                                ${zones.map(z => `<option value="${z}" ${ing && ing.zone === z ? 'selected' : ''}>${z}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Unidade Base</label>
                            <select ${isEdit ? 'disabled' : ''} id="ing-unit" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm font-mono text-white focus:outline-none focus:border-sky-400">
                                ${units.map(u => `<option value="${u}" ${ing && ing.baseUnit === u ? 'selected' : ''}>${u}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Fornecedor Preferencial</label>
                            <select id="ing-sup" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">
                                ${supOpts}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Conversão Embalagem → Base</label>
                            <input id="ing-pack" type="text" value="${ing ? escHtml(ing.packLabel) : 'Caixa 5 kg → 5,00 kg'}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm font-mono text-sky-300 focus:outline-none focus:border-sky-400">
                        </div>
                    </div>

                    <!-- Bloco Técnico: Margem de Perda, Stock Mínimo e Custos da Loja -->
                    <div class="p-4 rounded-xl bg-[#050814] border border-sky-400/25 space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="text-xs font-mono uppercase text-sky-400">
                                Parâmetros (${escHtml(appState.stores[targetStore].name)})
                            </span>
                            <span id="ing-yield-preview" class="text-xs font-mono px-2.5 py-0.5 rounded bg-blue-500/15 text-sky-300">

                            </span>
                        </div>

                                <input id="ing-loss" type="number" step="1" min="0" max="80" value="${lossPct}" oninput="updateYieldPreview(this.value)" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#0B1120] border border-amber-500/35 text-sm font-mono font-bold text-amber-300 focus:outline-none focus:border-amber-400">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1.5">Stock Mínimo (Alerta)</label>
                                <input  id="ing-min" type="number" step="0.1" min="0" value="${m.minStock}" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#0B1120] border border-[#1E293B] text-sm font-mono text-white focus:outline-none focus:border-sky-400">

                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1.5">Stock Teórico Atual</label>

                                <label class="block text-xs font-medium text-slate-300 mb-1.5">Último Custo de Compra (€)</label>

                    <div class="flex justify-end gap-3 pt-2">

                        <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-sky-500 hover:from-blue-500 hover:to-sky-400 shadow-lg">
                            ${isEdit ? 'Guardar & Recalcular Fichas' : 'Criar Insumo'}
                        </button>
                    </div>
                </form>
            `;
            openModal(isEdit ? 'Editar Insumo & Margem de Perda' : 'Novo Insumo no Catálogo', isEdit ? `${ing.name} (${ing.sku})` : 'Defina quebra técnica, stock mínimo e custo base', html, 'lg');
        }

        function updateYieldPreview(lossVal) {
            const loss = Math.max(0, Math.min(80, parseFloat(lossVal) || 0));
            const el = document.getElementById('ing-yield-preview');
            if (el) el.textContent = `Aproveitamento (Yield): ${100 - loss}%`;
        }

        function saveIngredientForm(e, ingId) {
            e.preventDefault();
            if (!appState.roles[appState.activeRole].canEditIngredients) return;

            const lossPct = Math.max(0, Math.min(80, parseFloat(document.getElementById('ing-loss').value) || 0));
            const yieldFactor = Number(((100 - lossPct) / 100).toFixed(4));
            const cmpVal = parseFloat(document.getElementById('ing-cmp').value);
            const lastVal = parseFloat(document.getElementById('ing-last').value);
            const stockVal = parseFloat(document.getElementById('ing-stock').value);
            const minVal = parseFloat(document.getElementById('ing-min').value);

            const baseMeta = {
                name: document.getElementById('ing-name').value.trim(),
                sku: document.getElementById('ing-sku').value.trim(),
                category: document.getElementById('ing-cat').value,
                zone: document.getElementById('ing-zone').value,
                baseUnit: document.getElementById('ing-unit').value,
                supplierId: document.getElementById('ing-sup').value,
                packLabel: document.getElementById('ing-pack').value.trim(),
                yieldFactor
            };

            

            if (ingId) {
                const existing = getIngredient(ingId);
                if (existing) {
                    Object.assign(existing, baseMeta);
                    existing.byStore[appState.activeStore].minStock = minVal;
                }
                showToast('Insumo atualizado & Cascata DAG executada', `${baseMeta.name}: perda ${lossPct}% (Yield ${Math.round(yieldFactor * 100)}%).`, 'success');
            } else {
                const byStore = {};
                STORE_KEYS.forEach(sk => {
                    const isTarget = appState.activeStore === sk;
                    byStore[sk] = {
                        stockTheoretical: isTarget ? stockVal : 0,
                        stockCounted: isTarget ? stockVal : 0,
                        minStock: isTarget ? minVal : 0,
                        cmp: cmpVal,
                        lastCost: lastVal,
                        prevCost: lastVal
                    };
                });
                appState.ingredients.unshift({
                    id: 'ing_' + Date.now(),
                    ...baseMeta,
                    priceHistory: [lastVal, lastVal, lastVal, lastVal],
                    byStore
                });
                showToast('Insumo criado', `${baseMeta.name} adicionado ao catálogo.`, 'success');
            }

            persistState();
            closeModal();
            updateChrome();
            renderActiveView();
        }

        function confirmDeleteIngredient(ingId) {
            if (!appState.roles[appState.activeRole].canEditIngredients) {
                showToast('Permissão RBAC insuficiente', 'O perfil atual não pode excluir insumos.', 'warning');
                return;
            }
            const ing = getIngredient(ingId);
            if (!ing) return;
            const usedIn = appState.recipes.filter(r => (r.items || []).some(it => it.type === 'ingredient' && it.refId === ingId));
            const html = `
                <div class="space-y-4">
                    <p class="text-sm text-slate-300">Pretende excluir o insumo <strong class="text-white">${escHtml(ing.name)}</strong> (${escHtml(ing.sku)})?</p>
                    ${usedIn.length > 0 ? `
                        <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-200">
                            ⚠ Este insumo está associado a <strong>${usedIn.length} ficha(s) técnica(s)</strong> (${usedIn.map(r => escHtml(r.name)).join(', ')}). A remoção fica bloqueada enquanto existirem referências.
                        </div>
                    ` : ''}
                    <div class="flex justify-end gap-3 pt-2">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm text-slate-300 border border-[#1E293B]">Cancelar</button>

                    </div>
                </div>

        function executeDeleteIngredient(ingId) {
            if (!appState.roles[appState.activeRole].canEditIngredients) return;
            const ing = getIngredient(ingId);
            if (appState.recipes.some(r=>r.items.some(i=>i.refId===ingId)) || appState.subRecipesInventory.some(s=>s.parentIngredientId===ingId) || appState.movements.some(m=>m.ingredient===ingId) || STORE_KEYS.some(k=>ing.byStore[k].stockTheoretical || ing.byStore[k].stockCounted)) {
                showToast('Ingrediente em utilização','Este artigo tem stock, movimentos ou fichas associados.','warning'); return;
            }
            appState.ingredients = appState.ingredients.filter(i => i.id !== ingId);
            persistState();
            closeModal();
            updateChrome();
            showToast('Insumo excluído', ing ? `${ing.name} removido e fichas técnicas atualizadas.` : 'Insumo removido.', 'warning');
            renderActiveView();
        }

        function generatePurchaseOrder(ingId, qty) {
            if (!appState.roles[appState.activeRole].canManageOrders) {
                showToast('Permissão RBAC insuficiente', 'O perfil atual não pode gerar encomendas.', 'warning');
                return;
            }
            const ing = getIngredient(ingId);
            const m = getIngMetricsForStore(ing, appState.activeStore);
            const sup = getSupplier(ing.supplierId);
            const orderKey = `${appState.activeStore}:${ingId}`;
            if (!appState.sentOrders.includes(orderKey)) {
                appState.sentOrders.push(orderKey);
                persistState();
            }
            const storeName = appState.stores[appState.activeStore].name;
            const supName = sup ? sup.name : 'Fornecedor';
            const msgText = `Olá ${supName},\n\nSegue pedido de encomenda Kareca Solutions para ${storeName}:\n• Artigo: ${ing.name} (${ing.sku})\n• Quantidade: ${qty} ${ing.baseUnit}\n• Valor Estimado s/ IVA: ${fmtEur(qty * m.lastCost)}\n• Entrega pretendida: Amanhã até às 10:00.\n\nObrigado,\nEquipa ${storeName}`;

            const html = `
                <div class="space-y-4">
                    <div class="flex items-center gap-2 text-xs font-mono text-emerald-400">
                        <span class="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30">Estado: PREPARADA</span>
                        <span>Destinatário: ${sup ? escHtml(sup.email) : '-'} / ${sup ? escHtml(sup.phone) : '-'}</span>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Preview da Mensagem (WhatsApp / E-mail)</label>
                        <textarea id="po-preview-text" rows="7" readonly class="w-full p-4 rounded-xl bg-[#050814] border border-[#1E293B] font-mono text-xs text-slate-200 focus:outline-none">${escHtml(msgText)}</textarea>
                    </div>
                    <div class="flex justify-end gap-3">
                        <button onclick="copyOrderText()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-[#111827] hover:bg-[#1E293B] border border-sky-400/30 text-sky-300">
                            Copiar Mensagem
                        </button>
                        <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white">
                            Concluir
                        </button>
                    </div>
                </div>
            `;
            openModal('Encomenda Gerada & Pronta a Enviar', `${supName} • ${ing.name} (${storeName})`, html);
            showToast('Mensagem de encomenda preparada', `${qty} ${ing.baseUnit} de ${ing.name} para ${supName}.`, 'success');
            renderActiveView();
        }

        function copyOrderText() {
            const area = document.getElementById('po-preview-text');
            if (!area) return;
            area.select();
            document.execCommand('copy');
            showToast('Copiado!', 'Texto da encomenda copiado para a área de transferência.', 'info');

        // --------------------------------------------------------------------
        // PAINEL 4: FICHAS TÉCNICAS (CRUD + OCR) & MATRIZ BCG DINÂMICA
        // --------------------------------------------------------------------
        function setRecipeSubTab(sub) {
            appState.recipeSubTab = sub;
            persistState();
            renderActiveView();
        }

        function selectRecipe(id) {
            appState.selectedRecipeId = id;
            persistState();
            renderActiveView();
        }

        function simulationIngredients(recipe, result = new Map(), visited = new Set()) {
            if (!recipe || visited.has(recipe.id)) return result;
            visited.add(recipe.id);
            for (const item of recipe.items) {
                if (item.type === 'sub_recipe') {
                    simulationIngredients(getRecipe(item.refId), result, visited);
                } else {
                    const ing = getIngredient(item.refId);
                    if (ing) result.set(ing.id,ing);
                }
            }
            return result;
        }

        function simulationResults(recipe, prices) {
            const unit = recipe.yieldUnit === 'un' ? 'dose' : escHtml(recipe.yieldUnit);
            const actual = calculateRecipeCost(recipe).unitCost;
            const simulated = calculateRecipeCost(recipe,prices).unitCost;
            const current = getChannelMetrics(recipe);
            const channels = getChannelMetrics(recipe,prices);
            const row = (name,a,b) => `<tr><th scope="row">${name}</th><td>${a}</td><td>${b}</td></tr>`;
            return `<h3>Impacto por ${unit}</h3><div class="overflow-x-auto"><table class="sim-table"><thead><tr><th>Indicador</th><th>Atual</th><th>Simulado</th></tr></thead>
                <tbody>${row('Custo da receita',fmtEur(actual),fmtEur(simulated))}
                ${channels.map((c,i)=>c.pvpNet>0?`<tr><th colspan="3">${escHtml(c.name)}</th></tr>
                    ${row('Food cost',fmtPct(current[i].foodCostPct),fmtPct(c.foodCostPct))}
                    ${row('Margem',fmtEur(current[i].marginEur),fmtEur(c.marginEur))}
                    ${row('Margem (%)',fmtPct(current[i].marginPct),fmtPct(c.marginPct))}`:'').join('')}</tbody></table></div>`;
        }

        function updateSimulation(form) {
            const result = document.getElementById('simulation-results');
            const recipe = getRecipe(form.dataset.recipe);
            if (!result || !recipe) return;
            const prices = new Map();
            for (const input of form.querySelectorAll('[data-ingredient]')) {
                const raw = input.value.trim();
                if (!raw) continue;
                if (!/^\d+(?:[.,]\d{1,4})?$/.test(raw) || !Number.isFinite(Number(raw.replace(',','.')))) {
                    result.textContent = 'Introduza um preço positivo ou zero, com até quatro casas decimais.';
                    return;
                }
                prices.set(input.dataset.ingredient,Number(raw.replace(',','.')));
            }
            result.innerHTML = simulationResults(recipe,prices);
        }

        function buildCostSimulation(selected) {
            const dishes = appState.recipes.filter(r=>r.recipeType==='final_product');
            const dish = dishes.find(r=>r.id===selected?.id) || dishes[0];
            if (!dish) return '<p class="work-panel">Crie uma ficha de produto final para simular os custos.</p>';
            const ingredients = [...simulationIngredients(dish).values()];
            return `<section class="work-panel"><h2>Simular custos de um prato</h2>
                <label class="work-field">Prato<select onchange="selectRecipe(this.value)">${dishes.map(r=>`<option value="${escHtml(r.id)}" ${r.id===dish.id?'selected':''}>${escHtml(r.name)}</option>`).join('')}</select></label>
                <h3>Preços dos ingredientes</h3><p class="work-muted">Introduza os preços que quer testar. Os campos vazios usam o custo médio atual.</p>
                <form data-recipe="${escHtml(dish.id)}" oninput="updateSimulation(this)" onsubmit="event.preventDefault()"><div class="work-list sim-ingredient-list">
                ${ingredients.map(ing=>{const cmp=getIngMetricsForStore(ing).cmp;
                    return `<label class="work-row count-entry"><span><strong>${escHtml(ing.name)}</strong><small>Atual: ${fmtEur(cmp,4)}/${escHtml(ing.baseUnit)}</small></span>
                        <span class="work-field">€ / ${escHtml(ing.baseUnit)}<input inputmode="decimal" autocomplete="off" data-ingredient="${escHtml(ing.id)}" placeholder="${fmtNum(cmp,4)}"></span></label>`;
                }).join('')}</div><div class="work-actions"><button type="button" class="work-btn" onclick="this.form.reset();updateSimulation(this.form)">Repor custos atuais</button></div></form>
                <div id="simulation-results" aria-live="polite">${simulationResults(dish,new Map())}</div></section>`;
        }

        function buildRecipeSheet(rec,role) {
            if (!rec) return '<p class="work-panel">Crie a primeira ficha técnica para começar.</p>';
            const list = appState.recipes;
            const editable = role.canEditRecipes;
            const cost = calculateRecipeCost(rec);
            return `<section class="work-panel"><label class="work-field">Escolher ficha técnica
                <select onchange="selectRecipe(this.value)">${list.map(r=>`<option value="${escHtml(r.id)}" ${r.id===rec.id?'selected':''}>${escHtml(r.name)}</option>`).join('')}</select></label>
                <div class="work-actions"><h2>${escHtml(rec.name)}</h2>${editable?`<button class="work-btn" onclick="openRecipeModal('${rec.id}')">Editar ficha</button>`:''}</div>
                <p class="work-muted">${escHtml(rec.code)} · ${escHtml(rec.category)} · ${rec.recipeType==='sub_recipe'?'Preparação intermédia':'Produto final'}</p>
                <p>Rendimento líquido: <strong>${fmtNum(rec.yieldQuantity*(1-(rec.cookingLossPct||0)/100),3)} ${escHtml(rec.yieldUnit)}</strong>

                    const isPrep=item.type==='sub_recipe';

                    return `<div class="work-row"><strong>${escHtml(ref?.name || 'Artigo indisponível')}</strong>
                        <span>${fmtNum(item.netQty,3)} ${escHtml(item.unit)} · ${isPrep?'Preparação':'Quantidade líquida'}</span>
                        ${item.note?`<small>${escHtml(item.note)}</small>`:''}</div>`;
                }).join('')}</div>
                <p class="work-muted">Outros custos do lote: ${fmtEur(rec.extraFixedCost||0)} · Custo total: ${fmtEur(cost.batchCost)}</p>
                ${rec.recipeType==='final_product'?`<details class="work-detail"><summary>Preços e margens por canal</summary><div class="work-list">
                    ${getChannelMetrics(rec).map(c=>`<div class="work-row"><strong>${escHtml(c.name)}</strong>PVP: ${fmtEur(c.pvpGross)} · Food cost: ${fmtPct(c.foodCostPct)} · Margem: ${fmtEur(c.marginEur)} (${fmtPct(c.marginPct)})</div>`).join('')}</div></details>`:''}
                ${editable?`<details class="work-detail"><summary>Outras ações</summary><button class="work-btn" onclick="confirmDeleteRecipe('${rec.id}')">Eliminar ficha</button></details>`:''}</section>`;
        }

        function renderRecipeFormRows() {
            const container = document.getElementById('recipe-form-rows-container');
            if (!container) return;

            const subRecipes = appState.recipes.filter(r => r.recipeType === 'sub_recipe');
            const units = ['kg', 'g', 'L', 'cl', 'ml', 'un'];

            container.innerHTML = appState.recipeFormRows.map((row, idx) => {
                const currentVal = `${row.type}:${row.refId}`;
                const ingOptions = appState.ingredients.map(i => {
                    return `<option value="ingredient:${i.id}" ${currentVal === 'ingredient:' + i.id ? 'selected' : ''}>${escHtml(i.name)}</option>`;
                }).join('');
                const subOptions = subRecipes.map(s => `<option value="sub_recipe:${s.id}" ${currentVal === 'sub_recipe:' + s.id ? 'selected' : ''}>[Sub-Receita] ${escHtml(s.name)}</option>`).join('');

                const base = row.type==='sub_recipe'?getRecipe(row.refId)?.yieldUnit:getIngredient(row.refId)?.baseUnit;
                const compatible = [['g','kg'],['ml','cl','L'],['un']].find(group=>group.includes(base)) || units;
                return `<fieldset class="work-row work-ingredient"><legend>Ingrediente ${idx+1}</legend>
                    <label class="work-field">Artigo ou preparação<select onchange="updateRecipeFormRow(${idx}, 'ref', this.value)">
                    <optgroup label="Ingredientes">${ingOptions}</optgroup><optgroup label="Preparações">${subOptions}</optgroup></select></label>
                    <div class="work-pair"><label class="work-field">Quantidade líquida<input type="number" step="any" min="0.000001" required value="${row.netQty || ''}" oninput="updateRecipeFormRow(${idx},'netQty',this.value)"></label>
                    <label class="work-field">Unidade<select onchange="updateRecipeFormRow(${idx},'unit',this.value)">${compatible.map(u=>`<option ${u===row.unit?'selected':''}>${u}</option>`).join('')}</select></label></div>
                    <label class="work-field">Nota (opcional)<input value="${escHtml(row.note||'')}" oninput="updateRecipeFormRow(${idx},'note',this.value)"></label>
                    <div><button class="work-btn" type="button" onclick="removeRecipeFormRow(${idx})" ${appState.recipeFormRows.length===1?'disabled':''}>Remover ingrediente</button></div></fieldset>`;
            }).join('');
        }

        function addRecipeFormRow() {
            const firstIng = appState.ingredients[0];
            appState.recipeFormRows.push({
                type: 'ingredient',
                refId: firstIng ? firstIng.id : 'ing_salmao',
                netQty: 0,
                unit: firstIng ? firstIng.baseUnit : 'kg',
                note: ''
            });
            renderRecipeFormRows();
            recalcRecipeModalPreview();
        }

        function removeRecipeFormRow(idx) {
            if (appState.recipeFormRows.length <= 1) {
                showToast('Mínimo 1 linha', 'A ficha técnica precisa de pelo menos um ingrediente ou sub-receita.', 'warning');
                return;
            }
            appState.recipeFormRows.splice(idx, 1);
            renderRecipeFormRows();
            recalcRecipeModalPreview();
        }

        function updateRecipeFormRow(idx, field, val) {
            const row = appState.recipeFormRows[idx];
            if (!row) return;
            if (field === 'ref') {
                const parts = val.split(':');
                row.type = parts[0];
                row.refId = parts[1];
                if (row.type === 'ingredient') {
                    const ing = getIngredient(row.refId);
                    if (ing) row.unit = ing.baseUnit;
                } else {
                    const sub = getRecipe(row.refId);
                    if (sub) row.unit = sub.yieldUnit;
                }
                renderRecipeFormRows();
            } else if (field === 'netQty') {
                row.netQty = parseFloat(val) || 0;
            } else if (field === 'unit') {
                row.unit = val;
            } else if (field === 'note') {
                row.note = val;
            }
            recalcRecipeModalPreview();
        }

        function recalcRecipeModalPreview() {
            const box = document.getElementById('recipe-modal-live-summary');
            if (!box) return;

            const tempRecipe = {
                id: 'temp_preview',
                recipeType: document.getElementById('rec-type')?.value || 'final_product',
                yieldQuantity: parseFloat(document.getElementById('rec-yield-qty')?.value) || 1,
                yieldUnit: document.getElementById('rec-yield-unit')?.value || 'un',
                cookingLossPct: parseFloat(document.getElementById('rec-cooking-loss')?.value) || 0,
                extraFixedCost: parseFloat(document.getElementById('rec-extra-cost')?.value) || 0,
                vatRate: parseFloat(document.getElementById('rec-vat')?.value) || 13,
                pvpSalaGross: parseFloat(document.getElementById('rec-pvp-sala')?.value) || 0,
                pvpTakeawayGross: parseFloat(document.getElementById('rec-pvp-sala')?.value) || 0,
                pvpUberGross: parseFloat(document.getElementById('rec-pvp-sala')?.value) || 0,
                items: appState.recipeFormRows
            };

            const issue = validateRecipe(tempRecipe,'temp_preview');
            if (issue) {box.textContent=issue;return;}
            const costObj = calculateRecipeCost(tempRecipe, null, new Set(), appState.activeStore);
            if (tempRecipe.recipeType === 'sub_recipe') {
                box.innerHTML = `
                    <div class="text-xs text-sky-300">Sub-Receita Calculada (com perdas de preparação &amp; cocção):</div>
                    <div class="text-base font-bold text-white">Custo Unitário: <span class="text-sky-400">${fmtEur(costObj.unitCost)}/${escHtml(tempRecipe.yieldUnit)}</span></div>
                `;
            } else {
                const sala = getChannelMetrics(tempRecipe, null, appState.activeStore)[0];
                box.innerHTML = `
                    <div>
                        <span class="text-[10px] text-slate-400 block">Custo Técnico</span>
                        <span class="text-base font-bold text-white">${fmtEur(sala.totalCost)}</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block">Food Cost Sala</span>
                        <span class="text-base font-bold ${sala.foodCostPct <= 30 ? 'text-emerald-400' : 'text-rose-400'}">${fmtPct(sala.foodCostPct)}</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block">Margem Bruta Sala (Classificação BCG Automática)</span>
                        <span class="text-base font-bold text-sky-400">${fmtEur(sala.marginEur)} (${fmtPct(sala.marginPct)})</span>
                    </div>
                `;
            }
        }

        function handleRecipeOcrFileUpload(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            const mode = (ext === 'xlsx' || ext === 'xls' || ext === 'csv') ? 'excel' : ext === 'pdf' ? 'pdf' : 'photo';

            const statusEl = document.getElementById('recipe-ocr-status');
            if (statusEl) {
                statusEl.classList.remove('hidden');
                statusEl.textContent = `⏳ A processar "${file.name}" com Google Gemini Vision / Parser...`;
            }

            setTimeout(() => applyRecipeOcrPreset(mode, file.name), 450);
        }

        function saveRecipeForm(e, recipeId) {
            e.preventDefault();
            if (!appState.roles[appState.activeRole].canEditRecipes) return;

            const validRows = appState.recipeFormRows.filter(r => r.netQty > 0);
            if (validRows.length === 0) {
                showToast('Adicione ingredientes', 'Insira pelo menos uma linha com quantidade superior a zero.', 'warning');
                return;
            }

            const payload = {
                name: document.getElementById('rec-name').value.trim(),
                code: document.getElementById('rec-code').value.trim(),
                category: document.getElementById('rec-cat').value,
                recipeType: document.getElementById('rec-type').value,
                yieldQuantity: parseFloat(document.getElementById('rec-yield-qty').value) || 1,
                yieldUnit: document.getElementById('rec-yield-unit').value,
                cookingLossPct: parseFloat(document.getElementById('rec-cooking-loss').value) || 0,
                extraFixedCost: parseFloat(document.getElementById('rec-extra-cost').value) || 0,
                pvpSalaGross: parseFloat(document.getElementById('rec-pvp-sala').value) || 0,
                pvpTakeawayGross: parseFloat(document.getElementById('rec-pvp-take').value) || 0,
                pvpUberGross: parseFloat(document.getElementById('rec-pvp-uber').value) || 0,
                vatRate: parseFloat(document.getElementById('rec-vat').value) || 13,
                items: validRows.map(r => ({ ...r }))
            };

            if (recipeId && appState.posMappings.some(m=>m.recipeIds.includes(recipeId)) && payload.recipeType!=='final_product') {
                showToast('Rever ficha','Esta ficha está associada a uma venda POS.','warning');return;
            }
            if (recipeId && appState.recipes.some(r=>r.items.some(i=>i.type==='sub_recipe' && i.refId===recipeId)) &&
                (payload.recipeType!=='sub_recipe' || payload.yieldUnit!==getRecipe(recipeId).yieldUnit)) {
                showToast('Rever ficha','Tipo e unidade de saída estão em uso noutras fichas.','warning');return;
            }
            const issue = validateRecipe(payload,recipeId);
            if (issue) {showToast('Rever ficha', issue,'warning');return;}
            if (recipeId) {
                const existing = getRecipe(recipeId);
                if (existing) Object.assign(existing, payload);
                appState.selectedRecipeId = recipeId;
                showToast('Ficha Técnica atualizada', `${payload.name} (${payload.code}) recalculada na cascata e Matriz BCG.`, 'success');
            } else {
                const newId = 'rec_' + Date.now();
                appState.recipes.unshift({
                    id: newId,
                    ...payload,
                    soldByStore: { chiado: 0 }
                });
                appState.selectedRecipeId = newId;
                showToast('Ficha Técnica criada', `${payload.name} (${payload.code}) adicionada ao menu.`, 'success');
            }

            persistState();
            closeModal();
            renderActiveView();
        }

        function confirmDeleteRecipe(recipeId) {
            if (!appState.roles[appState.activeRole].canEditRecipes) {
                showToast('Permissão RBAC insuficiente', 'O perfil atual não pode excluir fichas técnicas.', 'warning');
                return;
            }
            const rec = getRecipe(recipeId);
            if (!rec) return;
            const html = `
                <div class="space-y-4">
                    <p class="text-sm text-slate-300">Tem a certeza que pretende excluir a ficha técnica <strong class="text-white">${escHtml(rec.name)}</strong> (${escHtml(rec.code)})?</p>
                    <div class="flex justify-end gap-3 pt-2">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm text-slate-300 border border-[#1E293B]">Cancelar</button>
                        <button onclick="executeDeleteRecipe('${rec.id}')" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white">Sim, Excluir Ficha</button>
                    </div>
                </div>
            `;
            openModal('Excluir Ficha Técnica', 'Confirmação de remoção', html);
        }

        function executeDeleteRecipe(recipeId) {
            if (!appState.roles[appState.activeRole].canEditRecipes) return;
            const rec = getRecipe(recipeId);
            if (appState.posMappings.some(m => m.recipeIds.includes(recipeId)) || appState.recipes.some(r => r.items.some(i=>i.type==='sub_recipe' && i.refId===recipeId))) {
                showToast('Ficha em utilização','Remova primeiro as referências a esta ficha.','warning');return;
            }
            appState.recipes = appState.recipes.filter(r => r.id !== recipeId);
            if (appState.selectedRecipeId === recipeId) {
                appState.selectedRecipeId = appState.recipes[0]?.id || '';

        function savePosMapping(e) {
            e.preventDefault();
            if (!appState.roles[appState.activeRole].canApproveInvoices) return;
            const f = new FormData(e.target), code = f.get('code').trim(), recipe = getRecipe(f.get('recipe'));
            if (!recipe || !code) return;
            if (appState.posMappings.some(m=>m.posCode===code)) {showToast('Código já associado',code,'warning');return;}
            appState.posMappings.push({posCode:code,posName:recipe.name,type:'Direto 1-para-1',targets:['1× '+recipe.name],
                recipeIds:[recipe.id],channel:f.get('channel'),priceGross:Number(f.get('price'))});
            persistState(); renderActiveView(); showToast('Código associado',code,'success');
        }

        function deductIngredientsForRecipe(rec, multiplierQty, storeKey, txId, visited = new Set()) {
            if (!rec || visited.has(rec.id)) return;
            const nextVisited = new Set(visited);
            nextVisited.add(rec.id);
            const netYield = Math.max(0.001, rec.yieldQuantity*(1-(rec.cookingLossPct || 0)/100));
            const batches = multiplierQty/netYield;

            (rec.items || []).forEach(item => {
                if (item.type === 'ingredient') {
                    const ing = getIngredient(item.refId);
                    if (!ing || !ing.byStore[storeKey]) return;
                    const baseNet = convertToBaseQty(item.netQty, item.unit || ing.baseUnit, ing.baseUnit);
                    const grossDeduct = (baseNet / Math.max(0.05, ing.yieldFactor)) * batches;
                    const m = ing.byStore[storeKey];
                    if (m.countBasis == null) snapshotCount(ing,storeKey);
                    m.stockTheoretical -= grossDeduct;
                    appState.movements.push({store:storeKey,ingredient:ing.id,document:txId,qty:-grossDeduct,cmp:m.cmp,date:new Date().toISOString()});
                } else if (item.type === 'sub_recipe') {
                    const sub = getRecipe(item.refId);
                    if (!sub) return;
                    const subQty = convertToBaseQty(item.netQty, item.unit || sub.yieldUnit, sub.yieldUnit);
                    deductIngredientsForRecipe(sub, subQty * batches, storeKey, txId, nextVisited);
                }
            });
        }

        function processSaleTransaction(posCode, qty, sourceLabel) {
            if (!appState.roles[appState.activeRole].canApproveInvoices) throw Error('Perfil sem permissão para lançar vendas.');
            if (!STORE_KEYS.includes(appState.activeStore)) throw Error('Selecione uma loja para lançar vendas.');
            const mapping = appState.posMappings.find(m => m.posCode === posCode);
            if (!mapping || !mapping.recipeIds.length || mapping.recipeIds.some(id => !getRecipe(id))) throw Error('Artigo por mapear: '+posCode);
            if (!Number.isSafeInteger(qty) || qty <= 0) throw Error('Quantidade inválida.');
            const storeKey = appState.activeStore;
            for (const id of mapping.recipeIds) {
                const issue = validateRecipe(getRecipe(id),id);
                if (issue) throw Error(issue);
            }
            const rates = new Set(mapping.recipeIds.map(id => getRecipe(id).vatRate));
            if (rates.size > 1) throw Error('Menu com IVA misto: desagregue as linhas antes de importar.');
            const netSale = Math.round(mapping.priceGross * qty / (1 + [...rates][0]/100)*100)/100;
            const txId = crypto.randomUUID();
            let totalCogs = 0;

            mapping.recipeIds.forEach(recId => {
                const rec = getRecipe(recId);
                if (!rec) return;
                const channel = mapping.channel === 'uber_eats' ? 2 : mapping.channel === 'takeaway' ? 1 : 0;
                const cost = getChannelMetrics(rec,null,storeKey)[channel].totalCost;
                totalCogs += cost * qty;
                deductIngredientsForRecipe(rec, qty, storeKey, txId);
            });

            const sf = appState.storeFinancials[storeKey];
            sf.revenue += netSale;
            sf.cogs += totalCogs;
            if (mapping.channel === 'uber_eats') sf.deliveryFees += netSale * 0.30;
            sf.monthly[sf.monthly.length - 1].rev += netSale;
            sf.monthly[sf.monthly.length - 1].cogs += totalCogs;

            const now = new Date();
            const hhmm = now.toTimeString().slice(0, 5);
            appState.salesLog.unshift({
                id: txId, date:new Date().toISOString(), recipeIds:[...mapping.recipeIds],
                time: hhmm,
                store: storeKey,
                source: sourceLabel,
                channel: mapping.channel === 'uber_eats' ? 'Uber Eats' : mapping.channel === 'takeaway' ? 'Takeaway' : 'Sala',
                item: `${mapping.posName} (${mapping.posCode})`,
                qty,
                net: netSale,
                cogs: totalCogs
            });

            return { mapping, netSale, totalCogs, storeKey };
        }

        function simulatePosWebhookSale() {

            const qty = Math.max(1, parseInt(document.getElementById('sim-pos-qty').value, 10) || 1);

            try {res = processSaleTransaction(code, qty, 'Simulação POS');} catch (error) {showToast('Venda pendente',error.message,'warning');return;}

            persistState();
            showToast(
                `⚡ Venda POS (${appState.stores[res.storeKey].name})`,
                `${qty}× ${res.mapping.posName} • +${fmtEur(res.netSale)} | COGS: ${fmtEur(res.totalCogs)} | Matriz BCG atualizada`,

        function importSaleRows(rows, source, store) {
            if (!STORE_KEYS.includes(store) || store !== appState.activeStore) throw Error('Selecione a loja do ficheiro.');
            if (!appState.roles[appState.activeRole].canApproveInvoices) throw Error('Perfil sem permissão.');
            const before = structuredClone(appState);
            let inserted = 0;
            const seen = new Map(appState.importedSales.map(x => [x.key,x.signature]));
            try {
                for (const [id,code,rawQty] of rows) {
                    if (!id || !code) throw Error('Linha sem ID ou código POS.');
                    const qty = Number(rawQty);
                    const key = JSON.stringify([store,source,id]);
                    const signature = JSON.stringify([code,qty]);
                    if (seen.has(key)) {
                        if (seen.get(key) !== signature) throw Error('O ID '+id+' já tem dados diferentes.');
                        continue;
                    }
                    processSaleTransaction(code,qty,source);
                    appState.importedSales.push({key,signature});
                    seen.set(key,signature);
                    inserted++;
                }
                persistState();
            } catch (error) { appState = before; throw error; }
            updateChrome(); renderActiveView();
            showToast('Lote conferido',inserted+' linhas lançadas · '+(rows.length-inserted)+' já existentes','success');
            return inserted;
        }

        async function importSalesCsv(input) {
            const file = input.files[0], store = appState.activeStore;
            if (!file) return;
            try {
                const content = (await file.text()).replace(/^\uFEFF/,'').trim();
                const sep = content.split(/\r?\n/,1)[0].includes(';') ? ';' : ',';
                const rows = []; let row = [], value = '', quoted = false;
                for (let i=0; i<content.length; i++) {
                    const c = content[i];
                    if (c === '"') {
                        if (quoted && content[i+1] === '"') {value += '"'; i++;}
                        else quoted = !quoted;
                    } else if (!quoted && c === sep) {row.push(value.trim());value='';}
                    else if (!quoted && c === '\n') {row.push(value.trim());rows.push(row);row=[];value='';}
                    else value += c;
                }
                if (quoted) throw Error('Aspas por fechar no CSV.');
                row.push(value.trim()); rows.push(row);
                const header = rows.shift().map(x=>x.toLowerCase());
                const indexes = ['id_linha','codigo_pos','quantidade'].map(x=>header.indexOf(x));
                if (indexes.includes(-1)) throw Error('Cabeçalho esperado: id_linha;codigo_pos;quantidade');
                const entries = rows.filter(r=>r.some(Boolean)).map(r=>indexes.map(i=>r[i]));
                if (!entries.length) throw Error('Ficheiro sem vendas.');
                importSaleRows(entries,'CSV',store);
            } catch (error) {showToast('CSV pendente',error.message,'warning');}
            input.value = '';
        }

        function simulateFileImport() {
            try { importSaleRows([['1','POS-901',5],['2','POS-102',4],['3','POS-104',3]],'Lote de exemplo',appState.activeStore); }
            catch (error) {showToast('Lote pendente',error.message,'warning');}
        }

        // --------------------------------------------------------------------
        // PAINEL 6: INVENTÁRIO POR ZONAS, QUEBRAS & RELATÓRIO DE VARIÂNCIA
        // --------------------------------------------------------------------
        function countItems(store, zone) {
            return [...appState.ingredients.map(i=>({
                id:i.id, name:i.name, zone:i.zone, unit:i.baseUnit, prepared:false,
                expected:i.byStore[store].stockTheoretical, cost:i.byStore[store].cmp, yieldFactor:i.yieldFactor
            })), ...appState.subRecipesInventory.map(s=>({
                id:s.id, name:s.name, zone:s.zone, unit:s.unit, prepared:true, parent:s.parentIngredientId
            }))].filter(i=>!zone || i.zone===zone).sort((a,b)=>a.zone.localeCompare(b.zone,'pt') || a.name.localeCompare(b.name,'pt'));
        }

        function startCount(store, zone) {
            if (!appState.roles[appState.activeRole].canCountInventory || !STORE_KEYS.includes(store)) return;
            const items=countItems(store, zone);
            if (!items.length) {showToast('Zona sem artigos','','warning');return;}
            appState.countDrafts ??= {};
            appState.countDrafts[store] ??= {store,zone,items,values:{},review:false,adjust:false};
            appState.countDrafts[store].paused=false;
            appState.activeStore=store;
            persistState();updateChrome();renderActiveView();
        }

        function currentCount() {
            if (appState.roles[appState.activeRole].canCountInventory) return appState.countDrafts?.[appState.activeStore];
        }

        function countQuantity(value) {
            const str=String(value ?? '').trim();
            if (!/^\d+(?:[,.]\d{1,4})?$/.test(str)) return null;
            const n=Number(str.replace(',','.'));
            return Number.isFinite(n) && n<=99999999 ? n : null;
        }

        function writeCount(id,value) {
            const d=currentCount();
            if (!d || d.review || !d.items.some(i=>i.id===id)) return;
            d.values[id]=value;persistState();
            const el=document.getElementById('count-progress');
            if (el) el.textContent=countProgress(d);
        }

        function countProgress(d) {
            return d.items.filter(i=>countQuantity(d.values[i.id])!==null).length+' de '+d.items.length+' artigos contados';
        }

        function countRows(d) {
            return d.items.filter(i=>!i.prepared).map(i=>{
                const direct=countQuantity(d.values[i.id]);
                const prepared=d.items.filter(p=>p.prepared && p.parent===i.id)
                    .reduce((sum,p)=>sum+countQuantity(d.values[p.id])/i.yieldFactor,0);
                const counted=direct+prepared;
                return {ingredient:i.id,name:i.name,unit:i.unit,direct,prepared,expected:i.expected,
                    counted,cmp:i.cost,variance:(counted-i.expected)*i.cost};
            });
        }

        function countView(d) {

            if (d.review) return heading+`<section class="work-panel"><h2>Rever contagem</h2><p class="work-muted">As preparações estão incluídas no equivalente em matéria-prima.</p>
                <div class="work-list">${countRows(d).map(r=>`<div class="work-row"><strong>${escHtml(r.name)}</strong>Contado: ${fmtNum(r.counted,4)} ${escHtml(r.unit)} · Esperado: ${fmtNum(r.expected,4)} ${escHtml(r.unit)}<small>Diferença: ${fmtNum(r.counted-r.expected,4)} ${escHtml(r.unit)} · ${fmtEur(r.variance)}</small></div>`).join('')}</div>
                <label class="work-actions"><input type="checkbox" ${d.adjust?'checked':''} onchange="const d=currentCount();if(d){d.adjust=this.checked;persistState()}"> Acertar o stock teórico para as quantidades contadas</label>
                <p class="work-muted">O fecho guarda a contagem e os desvios. O acerto também lança um movimento de stock por diferença.</p>
                <div class="work-actions"><button class="work-btn" onclick="reviewCount(false)">Voltar à contagem</button>
                <button class="work-btn primary" onclick="finishCount()">Confirmar e fechar inventário</button></div></section>`;
            return heading+`<section class="work-panel"><h2>Contar artigos</h2><p>Introduz o que encontraste. Se não houver unidades de um artigo, escreve 0.</p>
                <p class="work-muted" id="count-progress">${countProgress(d)}</p>
                ${[...new Set(d.items.map(i=>i.zone))].map(z=>`<h3>${escHtml(z)}</h3><div class="work-list">${d.items.filter(i=>i.zone===z).map(i=>`
                    <label class="work-row count-entry"><span><strong>${escHtml(i.name)}</strong><small>${i.prepared?'Preparação pronta · ':''}Quantidade em ${escHtml(i.unit)}</small></span>
                    <input id="count-${i.id}" inputmode="decimal" autocomplete="off" maxlength="16" placeholder="—" value="${escHtml(d.values[i.id] ?? '')}" oninput="writeCount('${i.id}',this.value)"></label>`).join('')}</div>`).join('')}
                <div class="work-actions"><button class="work-btn primary" onclick="reviewCount(true)">Rever contagem</button>
                <button class="work-btn" onclick="parkCount()">Guardar e sair</button>
                <button class="work-btn" onclick="discardCount()">Descartar rascunho</button></div></section>`;
        }

        function parkCount() {
            const d=currentCount();if (!d) return;
            d.paused=true;persistState();renderActiveView();
        }

        function discardCount() {
            const d=currentCount();if (!d || !window.confirm('Descartar as quantidades deste rascunho?')) return;
            delete appState.countDrafts[d.store];persistState();renderActiveView();
        }

        function reviewCount(review) {
            const d=currentCount();if (!d) return;
            const missing=d.items.find(i=>countQuantity(d.values[i.id])===null);
            if (review && missing) {
                showToast('Rever quantidade',missing.name+' · introduza zero ou um valor positivo com até quatro casas decimais.','warning');
                document.getElementById('count-'+missing.id)?.focus();return;
            }
            d.review=review;persistState();renderActiveView();
            document.getElementById('main-content')?.scrollIntoView({block:'start'});
        }

        function finishCount() {
            const d=currentCount();
            if (!d?.review || d.items.some(i=>countQuantity(d.values[i.id])===null)) return;
            const latest=countItems(d.store,d.zone);
            const prior=new Map(d.items.map(i=>[i.id,i]));
            const changed=latest.filter(i=>JSON.stringify(i)!==JSON.stringify(prior.get(i.id)));
            if (changed.length || latest.length!==d.items.length) {
                changed.forEach(i=>delete d.values[i.id]); d.items=latest; d.review=false; d.adjust=false;
                persistState();renderActiveView();showToast('O stock ou catálogo mudou','Confira os artigos atualizados antes de fechar.','warning');return;
            }
            const before=structuredClone(appState), date=new Date().toISOString(), id=crypto.randomUUID();
            const rows=countRows(d);
            for (const i of d.items.filter(i=>i.prepared)) {
                appState.subRecipesInventory.find(s=>s.id===i.id).countedByStore[d.store]=countQuantity(d.values[i.id]);
            }
            for (const r of rows) {
                const ing=getIngredient(r.ingredient), m=ing.byStore[d.store];
                m.stockCounted=r.direct;snapshotCount(ing,d.store);
                if (d.adjust && Math.abs(r.counted-r.expected)>1e-9) {
                    appState.movements.push({store:d.store,ingredient:ing.id,document:id,date,qty:r.counted-r.expected,cmp:r.cmp,type:'acerto_inventario'});
                    m.stockTheoretical=r.counted;
                }
            }
            (appState.countHistory ??= []).unshift({id,date,store:d.store,zone:d.zone || 'Todas as zonas',rows,adjusted:d.adjust,
                entries:d.items.map(i=>({name:i.name,unit:i.unit,qty:countQuantity(d.values[i.id])}))});
            delete appState.countDrafts[d.store];
            try {persistState();} catch(error) {appState=before;throw error;}
            renderActiveView();showToast('Inventário fechado',appState.stores[d.store].name,'success');
        }

        function openWasteModal() {
            if (!appState.roles[appState.activeRole].canLogWaste) {
                showToast('Permissão RBAC insuficiente', 'O perfil atual não tem permissão para registar quebras operacionais.', 'warning');
                return;
            }
            const targetStore = RESTAURANT;
            const ingOpts = appState.ingredients.map(i => {
                const m = getIngMetricsForStore(i, targetStore);
                return `<option value="${i.id}" class="bg-[#0B1120]">${escHtml(i.name)} (CMP ${fmtEur(m.cmp)}/${escHtml(i.baseUnit)})</option>`;
            }).join('');

            const html = `
                <form onsubmit="submitWasteLog(event)" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Ingrediente</label>
                        <select id="waste-ing" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">
                            ${ingOpts}
                        </select>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Quantidade Desperdiçada</label>
                            <input id="waste-qty" type="number" step="0.1" min="0.1" value="0.8" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm font-mono text-white focus:outline-none focus:border-sky-400">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1.5">Motivo Operacional</label>
                            <select id="waste-reason" class="w-full px-3.5 py-2.5 rounded-xl bg-[#050814] border border-[#1E293B] text-sm text-white focus:outline-none focus:border-sky-400">
                                <option value="Validade">Validade Expirada</option>
                                <option value="Erro de Cozinha">Erro de Cozinha / Preparação</option>
                                <option value="Refeição de Equipa">Refeição de Equipa</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm text-slate-300 border border-[#1E293B]">Cancelar</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-500">Registar Quebra</button>
                    </div>
                </form>
            `;
            openModal('Registar Quebra / Desperdício', 'Abate ao stock teórico da loja para isolar desvios reais no inventário', html);
        }

        function submitWasteLog(e) {
            e.preventDefault();
            if (!appState.roles[appState.activeRole].canLogWaste) return;

            const store = RESTAURANT;
            const ing = getIngredient(document.getElementById('waste-ing').value);
            const qty = parseFloat(document.getElementById('waste-qty').value);
            const reason = document.getElementById('waste-reason').value;
            const storeMetrics = ing.byStore[store];
            const cost = qty * storeMetrics.cmp;

            if (!(qty > 0) || qty > storeMetrics.stockTheoretical) {showToast('Rever quebra','Quantidade superior ao stock disponível ou inválida.','warning');return;}
            if (storeMetrics.countBasis == null) snapshotCount(ing,store);
            storeMetrics.stockTheoretical -= qty;
            const wasteId = crypto.randomUUID();
            appState.movements.push({store,ingredient:ing.id,document:wasteId,qty:-qty,cmp:storeMetrics.cmp,date:new Date().toISOString()});
            const now = new Date();
            appState.wasteLogs.unshift({
                id: wasteId,
                date: now.toLocaleString('pt-PT'),
                store,
                item: ing.name,
                qty,
                unit: ing.baseUnit,
                reason,
                cost
            });

            persistState();
            closeModal();
            showToast('Quebra registada', `${fmtNum(qty, 1)} ${ing.baseUnit} de ${ing.name} em ${appState.stores[store].name} (${fmtEur(cost)})`, 'warning');
            renderActiveView();
        }
